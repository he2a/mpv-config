#-- Video Profiles --------------------------------------------------------#

[gpu-safe]
vo=gpu
gpu-api=auto
tone-mapping=spline

[gpu-vulkan]
vo=gpu-next
gpu-api=vulkan
tone-mapping=bt.2446a

[gpu-directx]
vo=gpu-next
gpu-api=d3d11
tone-mapping=bt.2446a

[hig-gpu]
scale=ewa_lanczos4sharpest
dscale=ewa_lanczos
cscale=mitchell
correct-downscaling=yes
linear-downscaling=no
linear-upscaling=no
sigmoid-upscaling=yes
hdr-compute-peak=yes
allow-delayed-peak-detect=no

[med-gpu]
scale=spline36
dscale=mitchell
cscale=spline36
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=no
sigmoid-upscaling=yes
hdr-compute-peak=yes
allow-delayed-peak-detect=yes

[low-gpu]
scale=bicubic_fast
dscale=bicubic_fast
cscale=bicubic_fast
correct-downscaling=no
linear-downscaling=no
linear-upscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no
allow-delayed-peak-detect=yes

[image-gpu]
glsl-shaders-clr
hwdec=no
scale=ewa_lanczos4sharpest
dscale=ewa_lanczos4sharpest
cscale=ewa_lanczos
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=no
sigmoid-upscaling=yes
deband=no
hdr-compute-peak=yes
allow-delayed-peak-detect=no

[pixart-gpu]
glsl-shaders-clr
scale=oversample
dscale=mitchell
cscale=oversample
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=yes
sigmoid-upscaling=no
deband=no
hdr-compute-peak=no
allow-delayed-peak-detect=no

#-- Conditional Profiles --------------------------------------------------#

# Add # before profile-cond to disable them.
[bt.2100-pq]
profile-cond=get("tone-mapping") == "clip" and get("video-params/primaries") == "bt.2020" and get("video-params/gamma") == "pq" and get("target-colorspace-hint") == false
profile-restore=copy
target-colorspace-hint=no
gamut-mapping-mode=clip
target-prim=bt.2020
target-trc=pq
glsl-shader=~~/shaders/hdr-toys/utils/clip_both.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/pq_inv.glsl
glsl-shader=~~/shaders/hdr-toys/tone-mapping/astra.glsl
glsl-shader=~~/shaders/hdr-toys/gamut-mapping/jedypod.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886.glsl
# Change as per monitor settings
glsl-shader-opts=reference_white=1000

[bt.2100-hlg]
profile-cond=get("tone-mapping") == "clip" and get("video-params/primaries") == "bt.2020" and get("video-params/gamma") == "hlg" and get("target-colorspace-hint") == false
profile-restore=copy
target-colorspace-hint=no
gamut-mapping-mode=clip
target-prim=bt.2020
target-trc=hlg
glsl-shader=~~/shaders/hdr-toys/utils/clip_both.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/hlg_inv.glsl
glsl-shader=~~/shaders/hdr-toys/tone-mapping/astra.glsl
glsl-shader=~~/shaders/hdr-toys/gamut-mapping/jedypod.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886.glsl
# Change as per monitor settings
glsl-shader-opts=reference_white=1000

[bt.2020]
profile-cond=get("tone-mapping") == "clip" and get("video-params/primaries") == "bt.2020" and get("video-params/gamma") == "bt.1886" and get("target-colorspace-hint") == false
profile-restore=copy
target-colorspace-hint=no
gamut-mapping-mode=clip
target-prim=bt.2020
target-trc=bt.1886
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886_inv.glsl
glsl-shader=~~/shaders/hdr-toys/gamut-mapping/bottosson.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886.glsl
# Change as per monitor settings
glsl-shader-opts=reference_white=1000

[openexr]
profile-cond=get("tone-mapping") == "clip" and get("file-format") == "exr_pipe" and get("target-colorspace-hint") == false
profile-restore=copy
target-colorspace-hint=no
gamut-mapping-mode=clip
target-prim=bt.2020
target-trc=linear
scale=bilinear
glsl-shader=~~/shaders/hdr-toys/utils/clip_black.glsl
glsl-shader=~~/shaders/hdr-toys/tone-mapping/astra.glsl
glsl-shader=~~/shaders/hdr-toys/gamut-mapping/jedypod.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886.glsl
# Change as per monitor settings
glsl-shader-opts=reference_white=1000

[radiance]
profile-cond=get("tone-mapping") == "clip" and get("file-format") == "hdr_pipe" and get("target-colorspace-hint") == false
profile-restore=copy
target-colorspace-hint=no
gamut-mapping-mode=clip
target-prim=bt.2020
target-trc=linear
vf=format:gamma=linear
scale=bilinear
glsl-shader=~~/shaders/hdr-toys/utils/clip_black.glsl
glsl-shader=~~/shaders/hdr-toys/tone-mapping/astra.glsl
glsl-shader=~~/shaders/hdr-toys/gamut-mapping/jedypod.glsl
glsl-shader=~~/shaders/hdr-toys/transfer-function/bt1886.glsl
# Adjust based on your monitor settings
glsl-shader-opts=reference_white=1000

[auto-fill]
profile-cond=((get("display-width") / get("video-params/aspect", 1.777)) <= get("height")) and (get("height") > get("display-height"))
profile-restore=copy
panscan=1.0

[interpolation-activate]
profile-cond=get("interpolation")
profile-restore=copy
video-sync=display-resample

[format-webm]
profile-cond=path:match("%.webm$")~=nil
profile-restore=copy
loop-file=inf

[format-gif]
profile-cond=path:match("%.gif$")~=nil
profile-restore=copy
profile=pixart-gpu
loop-file=inf

[format-web]
profile-cond=((path and path:match("^https?://")) ~= nil)
profile-restore=copy
cache=yes
loop-file=inf
audio-pitch-correction=no
ontop=yes
screenshot-template='%{media-title} - [%P]'

[audio-file]
profile-cond=(path and ((path:match("%.mp3$") or path:match("%.wav$") or path:match("%.ogm$") or path:match("%.flac$") or path:match("%.m4a$") or path:match("%.wma$") or path:match("%.ogg$") or path:match("%.opus$") or path:match("%.ac3$")) ~= nil))
profile-restore=copy
audio-pitch-correction=no
interpolation=no
gapless-audio=yes
loop-playlist=inf
loop-file=no
border=yes
ontop=yes

[loop-small]
profile-cond=get("duration") <= 60
profile-restore=copy
loop-file=inf

[displayhdr-auto]
#profile-cond=get("target-colorspace-hint")
profile-restore=copy
# Adjust based on your monitor settings
target-peak=1000
image-subs-hdr-peak=1000
sub-hdr-peak=1000
dither=error-diffusion
hdr-contrast-recovery=0.25
hdr-peak-percentile=99.991

