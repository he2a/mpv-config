#-- Profile ------------------------------------------------#

include="~~/profiles.conf"
include="~~/subtitles.conf"

#-- Video Settings -----------------------------------------#
profile=gpu-vulkan
profile=hig-gpu
profile=default-shaders

hwdec=auto-copy
hwdec-codecs=all
hr-seek-framedrop=no

tscale=oversample
tscale-blur=0.6991556596428412

video-sync=audio
interpolation=no
interpolation-preserve

deband=no
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=32

dither=no
temporal-dither
dither-depth=auto
error-diffusion=atkinson

geometry=50%:50%
autofit-larger=80%x80%
autofit-smaller=20%x20%
panscan=0.0

#-- Audio and Language Settings ----------------------------#

sub-use-margins=no
blend-subtitles=yes
alang=Japanese,jpn,jp,Korean,kor,ko,English,eng,en
slang=eng,English,en,en-US,US

replaygain=album
volume=100
volume-max=150
audio-pitch-correction=no
audio-channels=auto

demuxer-mkv-subtitle-preroll=yes
sub-auto=fuzzy

#-- Subtitle and OSD ---------------------------------------#

profile=sub-default
sub-scale-with-window=yes
sub-ass-scale-with-window=yes
sub-fix-timing=yes
blend-subtitles=yes

osd-font='O Sans Medium'
osd-font-size=45
osd-border-size=1.0
osd-color='#eeffffff'
osd-border-color='#dd1c1b22'
osd-shadow-offset=0.0
osd-blur=0.2
border=no

no-osc
no-osd-bar
osd-duration=500

#-- Screenshot ---------------------------------------------#

screenshot-sw=yes
screenshot-template='%F - [%05n]'
screenshot-format=jpg
screenshot-jpeg-quality=99
screenshot-jpeg-source-chroma=no

#-- Misc Settings ------------------------------------------#

cursor-autohide=4000
no-input-default-bindings

force-window=yes
keep-open=yes
snap-window
msg-level=all=info,display-tags=warn

loop-file=no
loop-playlist=no

save-position-on-quit=no
watch-later-options-clr

ytdl=yes
